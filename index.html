<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>♡ KAWAII TRAINING LOG ♡</title>
<style>
:root{--lav:#b99be8;--lavp:#f5effc;--pink:#efa7c5;--pinkp:#fff1f7;--ink:#51485a;--muted:#968c9c;--line:#e8dfee;--bg:#fcf9ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fbf8ff,#fff8fb);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 12px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 7px 24px #76548d12}
h1{text-align:center;font-size:22px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);line-height:1.6}.title{font-size:15px;font-weight:700;margin-bottom:13px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:14px;color:var(--ink);background:#fff;outline:0}input:focus,textarea:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lavp)}
.date{margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.exercise{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px;background:linear-gradient(135deg,#fff,#fcf9ff)}
.ehead{display:flex;gap:7px;margin-bottom:9px}.ehead input{font-weight:700}.btn{border:0;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}
.add{background:var(--lavp);color:#765c99}.save{background:linear-gradient(135deg,#b99be8,#d7a8dc);color:#fff}.remove{background:#f7f3f8;color:#978d9d;padding:7px 9px}.danger{background:#fff0f3;color:#b35e79}
table{width:100%;border-collapse:collapse}th{font-size:10px;color:var(--muted);font-weight:500;padding-bottom:5px}td{padding:3px}td:first-child{text-align:center;width:26px;color:var(--muted);font-size:11px}.setadd{margin-top:7px;border:1px dashed #d7c4e9;background:#faf6ff;color:#8064a1}
textarea{min-height:85px;resize:vertical}.buttons{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);font-size:12px;padding:10px}
.history{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #f1ebf4}.history:last-child{border:0}.hdate{font-weight:700;font-size:13px}.detail{font-size:11px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:5px}.tiny{font-size:11px;padding:7px 9px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#554a5b;color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.setrow{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto;gap:8px;align-items:center;margin:7px 0}.setnum{font-size:12px;font-weight:700;white-space:nowrap}.small{padding:8px 12px;font-size:12px}.summary{margin-top:10px;font-weight:800;text-align:right}.empty{padding:10px 0;opacity:.65}.subaccordion{margin-top:8px}.subhead{font-size:14px;padding:12px}.subaccordion .accordion-body{padding:10px 0 0}.inner{padding:12px 0;border-top:1px solid var(--line)}.inner:first-child{border-top:0}.accordion{overflow:hidden}.accordion-head{width:100%;border:0;background:linear-gradient(135deg,#fff,#fcf9ff);padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;color:#554a5b;cursor:pointer}.accordion-head .arrow{transition:.25s;font-size:13px}.accordion.open .accordion-head .arrow{transform:rotate(180deg)}.accordion-body{display:none;padding:12px 0 0}.accordion.open .accordion-body{display:block}.hero-sub{text-align:center;margin-bottom:14px}
</style>
</head>
<body><div class="wrap">
<header class="card"><h1>🎀 today's Training</h1><div class="sub hero-sub">できたことをかわいく残そう ♡</div><input id="date" class="date" type="date"></header>

<section class="card accordion" id="gymAccordion">
<button class="accordion-head" onclick="toggleAccordion('gymAccordion')"><span>🏋🏻‍♀️ ジムメニュー</span><span class="arrow">▼</span></button>
<div class="accordion-body">
<section class="inner accordion subaccordion" id="strengthAccordion">
<button class="accordion-head subhead" onclick="toggleAccordion('strengthAccordion')"><span>💪 筋トレメニュー</span><span class="arrow">▼</span></button>
<div class="accordion-body"><div id="exercises"></div><button class="btn add" onclick="addExercise()">＋ 種目を追加</button></div>
</section>
<section class="inner accordion subaccordion" id="treadmillAccordion">
<button class="accordion-head subhead" onclick="toggleAccordion('treadmillAccordion')"><span>🏃‍♂️ トレッドミル</span><span class="arrow">▼</span></button>
<div class="accordion-body"><div id="treadmillSets"></div><button class="btn add" onclick="addTreadmillSet()">＋ セットを追加</button><div class="summary" id="treadmillTotal">合計 0分</div></div>
</section>
</div></section>

<section class="card accordion" id="homeAccordion">
<button class="accordion-head" onclick="toggleAccordion('homeAccordion')"><span>🏠 宅トレ</span><span class="arrow">▼</span></button>
<div class="accordion-body">
<div id="homeWorkouts"></div>
<button class="btn add" onclick="addHomeWorkout()">＋ 宅トレ動画を追加</button>
</div></section>

<section class="card"><div class="title">🌷 今日のメモ</div><textarea id="note" placeholder="例：脚が軽かった／次回は重量アップしたい"></textarea>
<div class="buttons" style="margin-top:12px"><button class="btn save" onclick="save()">♡ 記録を保存</button><button class="btn add" onclick="resetForm()">入力をリセット</button></div></section>

<section class="card"><div class="title">📖 トレーニング履歴</div><div id="history"></div></section>
</div><div id="toast" class="toast"></div>
<script>
const KEY="kawaii_training_log_v3";let ex=[],home=[],treadmill=[];
const homeParts=["お腹","脚","お尻","腕","全身","ストレッチ","その他"];
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);$("date").value=today();
function toggleAccordion(id){$(id).classList.toggle("open")}
function addExercise(name="",sets=[{w:"",r:""}]){ex.push({name,sets});render()}
function removeExercise(i){ex.splice(i,1);render()}
function addSet(i){ex[i].sets.push({w:"",r:""});render()}
function removeSet(i,j){ex[i].sets.splice(j,1);render()}
function addTreadmillSet(v={speed:"",incline:"",min:""}){treadmill.push(v);renderTreadmill()}
function removeTreadmillSet(i){treadmill.splice(i,1);renderTreadmill()}
function renderTreadmill(){
 const b=$("treadmillSets");
 if(!treadmill.length){b.innerHTML='<div class="empty">まだセットがないよ ♡</div>'}
 else b.innerHTML=treadmill.map((t,i)=>`<div class="setrow"><div class="setnum">セット ${i+1}</div><input class="tm-speed" type="number" step="0.1" min="0" value="${esc(t.speed)}" placeholder="速度 km/h"><input class="tm-incline" type="number" step="0.5" min="0" value="${esc(t.incline)}" placeholder="傾斜 %"><input class="tm-min" type="number" step="1" min="0" value="${esc(t.min)}" placeholder="時間 分"><button class="btn remove" onclick="removeTreadmillSet(${i})">削除</button></div>`).join("");
 $("treadmillTotal").textContent=`合計 ${treadmill.reduce((s,x)=>s+(parseFloat(x.min)||0),0)}分`;
}
function addHomeWorkout(v={title:"",url:"",min:"",part:"お腹",status:"できた",note:""}){home.push(v);renderHome()}
function removeHome(i){home.splice(i,1);renderHome()}
function renderHome(){const b=$("homeWorkouts");if(!home.length){b.innerHTML='<div class="empty">まだ宅トレ動画がないよ ♡</div>';return}b.innerHTML=home.map((h,i)=>`<div class="exercise"><div class="ehead"><input class="h-title" value="${esc(h.title)}" placeholder="動画名（例：毎日プランク3分）"><button class="btn remove" onclick="removeHome(${i})">削除</button></div><div class="grid"><div><label>YouTube URL（任意）</label><input class="h-url" value="${esc(h.url)}" placeholder="https://youtu.be/..."></div><div><label>動画時間（分）</label><input class="h-min" type="number" min="0" value="${esc(h.min)}" placeholder="10"></div><div><label>部位</label><select class="h-part">${homeParts.map(x=>`<option ${x===h.part?"selected":""}>${x}</option>`).join("")}</select></div><div><label>達成度</label><select class="h-status"><option ${h.status==="できた"?"selected":""}>できた</option><option ${h.status==="途中まで"?"selected":""}>途中まで</option><option ${h.status==="断念"?"selected":""}>断念</option></select></div></div><div style="margin-top:10px"><label>メモ</label><input class="h-note" value="${esc(h.note)}" placeholder="例：お腹に効いた！またやりたい"></div></div>`).join("")}
function addSet(i){ex[i].sets.push({w:"",r:""});render()}function removeSet(i,j){if(ex[i].sets.length>1)ex[i].sets.splice(j,1);render()}function removeEx(i){ex.splice(i,1);render()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function syncHome(){document.querySelectorAll("#homeWorkouts .exercise").forEach((b,i)=>{home[i].title=b.querySelector(".h-title").value;home[i].url=b.querySelector(".h-url").value;home[i].min=b.querySelector(".h-min").value;home[i].part=b.querySelector(".h-part").value;home[i].status=b.querySelector(".h-status").value;home[i].note=b.querySelector(".h-note").value})}
function sync(){
 document.querySelectorAll("#exercises .exercise").forEach((b,i)=>{
  ex[i].name=b.querySelector(".ename").value;
  b.querySelectorAll("tbody tr").forEach((tr,j)=>{
   ex[i].sets[j].w=tr.querySelector(".weight").value;
   ex[i].sets[j].r=tr.querySelector(".reps").value;
  });
 });
 document.querySelectorAll("#treadmillSets .setrow").forEach((row,i)=>{
  treadmill[i].speed=row.querySelector(".tm-speed").value;
  treadmill[i].incline=row.querySelector(".tm-incline").value;
  treadmill[i].min=row.querySelector(".tm-min").value;
 });
}
function save(){sync();syncHome();let r={id:Date.now(),date:$("date").value||today(),exercises:ex.filter(e=>e.name.trim()),homeWorkouts:home.filter(h=>h.title.trim()),treadmill:treadmill.filter(t=>t.speed||t.incline||t.min),note:$("note").value};let rs=records().filter(x=>x.date!==r.date);rs.unshift(r);localStorage.setItem(KEY,JSON.stringify(rs));history();toast("保存したよ ♡")}
function load(id){let r=records().find(x=>x.id===id);if(!r)return;$("date").value=r.date;treadmill=Array.isArray(r.treadmill)?JSON.parse(JSON.stringify(r.treadmill)):(r.treadmill&& (r.treadmill.incline||r.treadmill.speed||r.treadmill.min)?[r.treadmill]:[]);renderTreadmill();$("note").value=r.note||"";ex=JSON.parse(JSON.stringify(r.exercises||[]));home=JSON.parse(JSON.stringify(r.homeWorkouts||[]));render();renderHome();renderTreadmill();
$("gymAccordion").classList.toggle("open", ex.length>0 || treadmill.length>0);
$("homeAccordion").classList.toggle("open", home.length>0);
$("strengthAccordion").classList.toggle("open", ex.length>0);
$("treadmillAccordion").classList.toggle("open", treadmill.length>0);
scrollTo({top:0,behavior:"smooth"})}
function del(id){if(!confirm("この記録を削除する？"))return;localStorage.setItem(KEY,JSON.stringify(records().filter(x=>x.id!==id)));history();toast("削除したよ")}
function resetForm(){$("date").value=today();treadmill=[];$("note").value="";ex=[];home=[];renderTreadmill();render();renderHome();$("gymAccordion").classList.remove("open");$("homeAccordion").classList.remove("open")}
function history(){let b=$("history"),rs=records().sort((a,b)=>b.date.localeCompare(a.date));if(!rs.length){b.innerHTML='<div class="empty">まだ記録がないよ ♡</div>';return}b.innerHTML=rs.map(r=>{let n=(r.exercises||[]).length,s=(r.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0),tm=Array.isArray(r.treadmill)?r.treadmill:((r.treadmill&&r.treadmill.min)?[r.treadmill]:[]),d=[n?`💪 ${n}種目・${s}セット`:null,tm.length?`🏃‍♂️ ${tm.map(t=>`${t.incline||0}%・${t.speed||0}km/h・${t.min||0}分`).join(" / ")}`:null,(r.homeWorkouts||[]).length?`🏠 ${(r.homeWorkouts||[]).length}本`:null].filter(Boolean).join(" ・ ")||"記録あり";return `<div class="history"><div><div class="hdate">${r.date.replaceAll("-","/")}</div><div class="detail">${d}</div></div><div class="actions"><button class="btn add tiny" onclick="load(${r.id})">見る</button><button class="btn danger tiny" onclick="del(${r.id})">削除</button></div></div>`}).join("")}
function toast(m){let t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
addExercise("レッグプレス");addExercise("アーム系");render();renderHome();history();
</script></body></html>
